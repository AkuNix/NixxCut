[package]
name = "nixxcut-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The NixXCut API: one dispatcher for projects, edits, media, effects, templates, exports and frames, which every transport - the command line, a daemon, a plugin - calls."

[dependencies]
nixxcut-core.workspace = true
nixxcut-project.workspace = true
nixxcut-effects.workspace = true
nixxcut-export.workspace = true
nixxcut-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The frame method hands back a PNG: the one picture format every
# caller reads and that keeps the compositor's pixels exact.
png = "0.17"
# A frame handed back inline crosses as text.
base64 = "0.22"
schemars = { workspace = true, optional = true }

[features]
# A JSON Schema for every request, generated from the types and their doc
# comments: what nixxcut-mcp gives an agent for each tool's arguments.
schema = ["dep:schemars", "nixxcut-project/schema"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
